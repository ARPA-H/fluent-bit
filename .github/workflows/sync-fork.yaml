name: Sync master with upstream + build + release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    outputs:
      latest_tag: ${{ steps.get_tags.outputs.latest_upstream_tag }}
      should_build: ${{ steps.compare.outputs.build_required }}

    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          

      - name: Fetch and sync upstream changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/fluent/fluent-bit.git
          # git fetch upstream
          # git merge upstream/master
          # git push origin master
        
      - name: Get Latest Local Tag and Upstream Tag SHAs
        id: get_tags
        run: |

          # Get the latest local tag (if any)
          LATEST_LOCAL_TAG=$(git tag --sort=-v:refname | head -n 1)
          LATEST_LOCAL_TAG_SHA=""
          if [ -n "$LATEST_LOCAL_TAG" ]; then
            LATEST_LOCAL_TAG_SHA=$(git rev-parse $LATEST_LOCAL_TAG)
          fi
          echo "Latest Local Tag: $LATEST_LOCAL_TAG (SHA: $LATEST_LOCAL_TAG_SHA)"
          echo "latest_local_tag=$LATEST_LOCAL_TAG" >> "$GITHUB_OUTPUT"
          echo "latest_local_tag_sha=$LATEST_LOCAL_TAG_SHA" >> "$GITHUB_OUTPUT"
          
          git fetch upstream --tags
          # Get the latest upstream tag (after fetching, it's now local)
          # We again sort by version. This will give you the latest tag from the *combined* set
          # of local tags and fetched upstream tags. If a new upstream tag is newer, it will be found.
          LATEST_UPSTREAM_TAG=$(git tag --sort=-v:refname | head -n 1)
          LATEST_UPSTREAM_TAG_SHA=$(git rev-parse $LATEST_UPSTREAM_TAG)
          echo "Latest Upstream Tag (after fetch): $LATEST_UPSTREAM_TAG (SHA: $LATEST_UPSTREAM_TAG_SHA)"
          echo "latest_upstream_tag=$LATEST_UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "latest_upstream_tag_sha=$LATEST_UPSTREAM_TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Compare Tags
        id: compare
        run: |
          BUILD_REQUIRED="false"
          LATEST_LOCAL_TAG="${{ steps.get_tags.outputs.latest_local_tag }}"
          LATEST_LOCAL_TAG_SHA="${{ steps.get_tags.outputs.latest_local_tag_sha }}"
          LATEST_UPSTREAM_TAG="${{ steps.get_tags.outputs.latest_upstream_tag }}"
          LATEST_UPSTREAM_TAG_SHA="${{ steps.get_tags.outputs.latest_upstream_tag_sha }}"

          echo "Comparing..."
          echo "Local Tag: $LATEST_LOCAL_TAG (SHA: $LATEST_LOCAL_TAG_SHA)"
          echo "Upstream Tag: $LATEST_UPSTREAM_TAG (SHA: $LATEST_UPSTREAM_TAG_SHA)"

          # Scenario 1: No local tags, but upstream has tags
          if [ -z "$LATEST_LOCAL_TAG" ] && [ -n "$LATEST_UPSTREAM_TAG" ]; then
            echo "No local tags found, but upstream has tags. Build required."
            BUILD_REQUIRED="true"
            git push origin "$LATEST_UPSTREAM_TAG"
          # Scenario 2: Latest upstream tag is different from latest local tag
          elif [ "$LATEST_UPSTREAM_TAG" != "$LATEST_LOCAL_TAG" ]; then
            echo "Upstream has a new latest tag: $LATEST_UPSTREAM_TAG. Build required."
            BUILD_REQUIRED="true"
            git push origin "$LATEST_UPSTREAM_TAG"
          # Scenario 3: Latest tags have the same name, but point to different commits (tag moved/recreated)
          elif [ "$LATEST_UPSTREAM_TAG" = "$LATEST_LOCAL_TAG" ] && [ "$LATEST_UPSTREAM_TAG_SHA" != "$LATEST_LOCAL_TAG_SHA" ]; then
            echo "Latest tag '$LATEST_UPSTREAM_TAG' has been modified (SHA changed). Build required."
            BUILD_REQUIRED="true"
          else
            echo "No new tags or changes to the latest tag. No build required."
          fi

          echo "build_required=$BUILD_REQUIRED" >> "$GITHUB_OUTPUT"

  build-and-relase:
    runs-on: macos-14
    if: needs.sync.outputs.should_build == 'true'
    needs: sync
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ needs.sync.outputs.latest_tag }}

      - name: Install dependencies
        run: |
          brew update
          brew install bison flex libyaml openssl pkgconfig || true

      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"

      - name: Build Fluent Bit packages
        run: |
          export LIBRARY_PATH=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/lib:$LIBRARY_PATH
          cmake -DCMAKE_INSTALL_PREFIX=/Library/Management/fluent-bit -DCPACK_GENERATOR=productbuild -DFLB_NIGHTLY_BUILD=false ../ -DOPENSSL_ROOT_DIR=$(brew --prefix openssl)
          cmake --build .
        working-directory: build

      - name: Bundle libyaml and fix install name
        run: |
          echo "Current working directory: $(pwd)"
          
          # Find the fluent-bit binary
          FLUENT_BIT_BIN=$(find build/ -type f -name 'fluent-bit' | grep -v '\.dSYM')
          echo "Found fluent-bit binary at: $FLUENT_BIT_BIN"
          
          # Check what libraries the binary depends on
          echo "Dependencies before patching:"
          otool -L "$FLUENT_BIT_BIN" | grep dylib
          
          # # Find the exact libyaml path being referenced
          # YAML_REF=$(otool -L "$FLUENT_BIT_BIN" | grep openssl | awk '{print $1}')
          # echo "Binary references yaml library: $YAML_REF"
          
          # # Get the actual file path from the brew installation
          # YAML_DIR=$(brew --prefix libyaml)/lib
          # echo "libyaml library directory: $YAML_DIR"
          # echo "libyaml files available:"
          # ls -la "$YAML_DIR"
          
          # # Find the dylib file that corresponds to the reference
          # YAML_FILE=$(basename "$YAML_REF")
          # YAML_PATH="$YAML_DIR/$YAML_FILE"
          # if [ ! -f "$YAML_PATH" ]; then
          #   # Look for the symlink target if the exact file doesn't exist
          #   for file in "$YAML_DIR"/libyaml*.dylib; do
          #     if [[ -L "$file" && "$(readlink "$file")" == "$YAML_FILE" ]]; then
          #       YAML_PATH="$file"
          #       break
          #     fi
          #   done
          # fi
          
          # echo "Using yaml library: $YAML_PATH"
          
          # Create Frameworks directory in the same location as the binary
          BINARY_DIR=$(dirname "$FLUENT_BIT_BIN")
          FRAMEWORKS_DIR="$BINARY_DIR/../Frameworks"
          mkdir -p "$FRAMEWORKS_DIR"
          
          # Copy the library to Frameworks directory
          # cp "$YAML_PATH" "$FRAMEWORKS_DIR/$YAML_FILE"
          # echo "Copied $YAML_PATH to $FRAMEWORKS_DIR/$YAML_FILE"
          
          # Change the install name in the binary
          # install_name_tool -change "/opt/homebrew/opt/openssl@3/lib/libssl.3.dylib" "@executable_path/../Frameworks/$YAML_FILE" "$FLUENT_BIT_BIN"
          
          # # Check if install_name_tool worked
          # echo "Dependencies after patching:"
          # otool -L "$FLUENT_BIT_BIN" | grep yaml
          
          # # Create a CMake install component for Frameworks
          # # This ensures the Frameworks directory gets included in the package
          # mkdir -p build/packaging/components
          # cat > build/packaging/components/Frameworks.cmake << EOF
          # file(INSTALL DESTINATION "\${CMAKE_INSTALL_PREFIX}/Frameworks" TYPE FILE FILES "${FRAMEWORKS_DIR}/${YAML_FILE}")
          # EOF
          
          # Optionally codesign
          # codesign --sign - "$FRAMEWORKS_DIR/$YAML_FILE"
        shell: bash

      - name: Create libyaml dependency package
        run: |
          echo "Creating separate libyaml dependency package..."
          
          # Find the fluent-bit binary to identify required dependencies
          FLUENT_BIT_BIN=$(find build/ -type f -name 'fluent-bit' | grep -v '\.dSYM')
          echo "Found fluent-bit binary at: $FLUENT_BIT_BIN"
          
          # Check for yaml dependency
          echo "Checking dependencies..."
          DEPS=$(otool -L "$FLUENT_BIT_BIN" | grep yaml)
          echo "$DEPS"
          
          # Find the exact libyaml path being referenced
          YAML_REF=$(otool -L "$FLUENT_BIT_BIN" | grep libyaml | awk '{print $1}')
          if [ -z "$YAML_REF" ]; then
            echo "No libyaml dependency found, skipping package creation"
            exit 0
          fi
          echo "Binary references yaml library: $YAML_REF"
          
          # Get the actual file path from the brew installation
          YAML_DIR=$(brew --prefix libyaml)/lib
          echo "libyaml library directory: $YAML_DIR"
          echo "Available yaml libraries:"
          ls -la "$YAML_DIR" | grep yaml
          
          # Find the dylib file that corresponds to the reference
          YAML_FILE=$(basename "$YAML_REF")
          YAML_PATH="$YAML_DIR/$YAML_FILE"
          if [ ! -f "$YAML_PATH" ]; then
            # Try to find by pattern if exact file not found
            YAML_PATH=$(find "$YAML_DIR" -name "libyaml*.dylib" | head -1)
            if [ -z "$YAML_PATH" ]; then
              echo "Error: Could not find libyaml library"
              exit 1
            fi
            YAML_FILE=$(basename "$YAML_PATH")
          fi
          echo "Using yaml library: $YAML_PATH"
          
          # Get version information from libyaml
          LIBYAML_VERSION=$(brew info --json=v2 libyaml | jq -r '.formulae[0].versions.stable' 2>/dev/null || echo "0.2.5")
          echo "libyaml version: $LIBYAML_VERSION"
          
          # Create a directory structure for the libyaml package
          STAGING_DIR=$(mktemp -d)
          INSTALL_DIR="$STAGING_DIR/Library/Management/fluent-bit/Frameworks"
          mkdir -p "$INSTALL_DIR"
          
          # Copy the libyaml library to the staging directory
          cp "$YAML_PATH" "$INSTALL_DIR/$YAML_FILE"
          echo "Copied $YAML_PATH to $INSTALL_DIR/$YAML_FILE"
          
          # Create a simple pkg using pkgbuild
          LIBYAML_PKG="build/fluent-bit-libyaml-$LIBYAML_VERSION-apple.pkg"
          pkgbuild --root "$STAGING_DIR" \
                   --identifier "com.fluentbit.pkg.libyaml" \
                   --version "$LIBYAML_VERSION" \
                   --install-location "/" \
                   "$LIBYAML_PKG"
          
          echo "Created libyaml package: $LIBYAML_PKG"
          
          # Clean up
          rm -rf "$STAGING_DIR"
          
          # Optionally sign the package
          # productsign --sign "Developer ID Installer: Your Name" "$LIBYAML_PKG" "$LIBYAML_PKG.signed"
          # mv "$LIBYAML_PKG.signed" "$LIBYAML_PKG"
        shell: bash
        
      - name: Create OpenSSL dependency package
        run: |
          echo "Creating separate OpenSSL dependency package..."
          
          # Find the fluent-bit binary to identify required dependencies
          FLUENT_BIT_BIN=$(find build/ -type f -name 'fluent-bit' | grep -v '\.dSYM')
          echo "Found fluent-bit binary at: $FLUENT_BIT_BIN"
          
          # Check for OpenSSL dependencies
          echo "Checking for OpenSSL dependencies..."
          OPENSSL_DEPS=$(otool -L "$FLUENT_BIT_BIN" | grep -E 'libssl|libcrypto')
          echo "$OPENSSL_DEPS"
          
          # If no OpenSSL dependencies, exit early
          if [ -z "$OPENSSL_DEPS" ]; then
            echo "No OpenSSL dependencies found, skipping package creation"
            exit 0
          fi
          
          # Get the OpenSSL brew installation path
          OPENSSL_DIR=$(brew --prefix openssl)/lib
          echo "OpenSSL library directory: $OPENSSL_DIR"
          echo "Available OpenSSL libraries:"
          ls -la "$OPENSSL_DIR" | grep -E 'libssl|libcrypto'
          
          # Get version information from OpenSSL
          OPENSSL_VERSION=$(brew info --json=v2 openssl | jq -r '.formulae[0].versions.stable' 2>/dev/null || echo "3.0.0")
          echo "OpenSSL version: $OPENSSL_VERSION"
          
          # Create a directory structure for the OpenSSL package
          STAGING_DIR=$(mktemp -d)
          INSTALL_DIR="$STAGING_DIR/Library/Management/fluent-bit/Frameworks"
          mkdir -p "$INSTALL_DIR"
          
          # Find and copy all OpenSSL libraries needed by the binary
          for LIB_REF in $(otool -L "$FLUENT_BIT_BIN" | grep -E 'libssl|libcrypto' | awk '{print $1}'); do
            LIB_FILE=$(basename "$LIB_REF")
            LIB_PATH="$OPENSSL_DIR/$LIB_FILE"
            
            # If direct file not found, try to find it
            if [ ! -f "$LIB_PATH" ]; then
              # Try to match by pattern
              PATTERN=$(echo "$LIB_FILE" | sed 's/\.[0-9]*\.[0-9]*$/.*/')
              LIB_PATH=$(find "$OPENSSL_DIR" -name "$PATTERN" | head -1)
              
              if [ -z "$LIB_PATH" ]; then
                echo "Warning: Could not find OpenSSL library $LIB_FILE"
                continue
              fi
              LIB_FILE=$(basename "$LIB_PATH")
            fi
            
            # Copy the library
            echo "Copying $LIB_PATH to $INSTALL_DIR/$LIB_FILE"
            cp "$LIB_PATH" "$INSTALL_DIR/$LIB_FILE"
            
            # If this is a symlink, follow and copy the actual library
            if [[ -L "$LIB_PATH" ]]; then
              REAL_LIB=$(readlink "$LIB_PATH")
              if [[ "$REAL_LIB" != /* ]]; then
                REAL_LIB="$OPENSSL_DIR/$REAL_LIB"
              fi
              REAL_LIB_FILE=$(basename "$REAL_LIB")
              echo "Copying linked library $REAL_LIB to $INSTALL_DIR/$REAL_LIB_FILE"
              cp "$REAL_LIB" "$INSTALL_DIR/$REAL_LIB_FILE"
            fi
          done
          
          # Create a simple pkg using pkgbuild
          OPENSSL_PKG="build/fluent-bit-openssl-$OPENSSL_VERSION-apple.pkg"
          pkgbuild --root "$STAGING_DIR" \
                  --identifier "com.fluentbit.pkg.openssl" \
                  --version "$OPENSSL_VERSION" \
                  --install-location "/" \
                  "$OPENSSL_PKG"
          
          echo "Created OpenSSL package: $OPENSSL_PKG"
          
          # Clean up
          rm -rf "$STAGING_DIR"
        shell: bash

      - name: Build pkg with cpack
        run: cpack -G productbuild
        working-directory: build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/fluent-bit-*-apple*.pkg
          tag_name: ${{ needs.sync.outputs.latest_tag }}
          body: |
            ## Fluent Bit Release ${{ needs.sync.outputs.latest_tag }}
            
            This release includes three packages:
            1. **fluent-bit-libyaml-*-apple.pkg** - Install this dependency package FIRST
            2. **fluent-bit-openssl-*-apple.pkg** - Install this dependency package SECOND
            3. **fluent-bit-*-apple.pkg** - Install the main Fluent Bit package LAST
            
            ### Installation Instructions:
            1. Download all .pkg files
            2. Install the libyaml dependency: `sudo installer -pkg fluent-bit-libyaml-*-apple.pkg -target /`
            3. Install the OpenSSL dependency: `sudo installer -pkg fluent-bit-openssl-*-apple.pkg -target /`
            4. Install Fluent Bit: `sudo installer -pkg fluent-bit-*-apple.pkg -target /`
            
            All dependencies will be installed to `/Library/Management/fluent-bit/Frameworks/` to ensure proper dependency resolution.