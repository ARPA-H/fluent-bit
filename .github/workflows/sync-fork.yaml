name: Sync master with upstream + build + release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    outputs:
      latest_tag: ${{ steps.compare.outputs.latest_upstream_tag }}
      should_build: ${{ steps.compare.outputs.build_required }}

    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          

      - name: Fetch and sync upstream changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/fluent/fluent-bit.git
          # git fetch upstream
          # git merge upstream/master
          # git push origin master
        
      - name: Get latest upstream release and compare
        id: compare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Get the latest official release tag from upstream (excludes drafts and prereleases)
          LATEST_UPSTREAM_TAG=$(gh api repos/fluent/fluent-bit/releases/latest --jq '.tag_name')
          echo "Latest upstream release: $LATEST_UPSTREAM_TAG"

          # Check if we already have a matching release in our fork
          BUILD_REQUIRED="false"
          if gh api repos/${{ github.repository }}/releases/tags/$LATEST_UPSTREAM_TAG --silent 2>/dev/null; then
            echo "Local release $LATEST_UPSTREAM_TAG already exists. No build required."
          else
            echo "No local release for $LATEST_UPSTREAM_TAG. Build required."
            BUILD_REQUIRED="true"
            # Fetch just this tag from upstream and push it to our fork
            git fetch upstream tag "$LATEST_UPSTREAM_TAG" --force
            git push origin "$LATEST_UPSTREAM_TAG" --force
          fi

          echo "latest_upstream_tag=$LATEST_UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "build_required=$BUILD_REQUIRED" >> "$GITHUB_OUTPUT"

  build-and-release:
    runs-on: macos-14
    if: needs.sync.outputs.should_build == 'true'
    needs: sync
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ needs.sync.outputs.latest_tag }}

      - name: Install dependencies
        run: |
          brew update
          brew install bison flex libyaml openssl pkgconfig || true

      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"

      - name: Build Fluent Bit
        run: |
          export LIBRARY_PATH=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/lib:$LIBRARY_PATH
          export HOMEBREW_DEPENDENCIES="libyaml openssl bison flex pkgconfig"
          cmake -DCMAKE_INSTALL_PREFIX=/Library/Management/fluent-bit -DCPACK_GENERATOR=productbuild ../ -DOPENSSL_ROOT_DIR=$(brew --prefix openssl)
          cmake --build .
        working-directory: build

      - name: Copy Dependencies and Fix Install Names
        run: |
          echo "Current working directory: $(pwd)"
        
          # Find the fluent-bit binary
          FLUENT_BIT_BIN=$(find build/ -type f -name 'fluent-bit' | grep -v '\.dSYM')
          echo "Found fluent-bit binary at: $FLUENT_BIT_BIN"
        
          # Create Frameworks directory
          BINARY_DIR=$(dirname "$FLUENT_BIT_BIN")
          FRAMEWORKS_DIR="$BINARY_DIR/../Frameworks"
          mkdir -p "$FRAMEWORKS_DIR"
        
          # Get list of dependencies (excluding system libraries)
          deps=$(otool -L "$FLUENT_BIT_BIN" | grep -v "/usr/lib\|/System" | awk '{print $1}' | grep -E '\.dylib|\.so')
        
          for dep in $deps; do
              if [ -f "$dep" ] || [ -L "$dep" ]; then
                  echo "Processing: $dep"
                  base=$(basename "$dep")
                
                  # Try copying with -L to follow symlinks, and handle permission errors
                  if cp -L "$dep" "$FRAMEWORKS_DIR/" 2>/dev/null; then
                      echo "Successfully copied $dep"
                  else
                      echo "Failed to copy $dep with cp -L, trying with sudo..."
                      sudo cp -L "$dep" "$FRAMEWORKS_DIR/" || {
                          echo "Warning: Could not copy $dep even with sudo, trying to find actual file..."
                          # If it's a symlink, try to resolve it
                          if [ -L "$dep" ]; then
                              real_file=$(readlink -f "$dep" 2>/dev/null || readlink "$dep")
                              echo "Resolved symlink to: $real_file"
                              if [ -f "$real_file" ]; then
                                  sudo cp "$real_file" "$FRAMEWORKS_DIR/$base" || echo "Warning: Could not copy resolved file $real_file"
                              fi
                          fi
                      }
                  fi
                
                  # Only try to update install names if the file was successfully copied
                  if [ -f "$FRAMEWORKS_DIR/$base" ]; then
                      # Update the binary to look for the library in @executable_path
                      install_name_tool -change "$dep" "@executable_path/../Frameworks/$base" "$FLUENT_BIT_BIN"
                    
                      # Update the library's own install name
                      install_name_tool -id "@loader_path/$base" "$FRAMEWORKS_DIR/$base"
                    
                      # Recursively handle dependencies of this library
                      subdeps=$(otool -L "$FRAMEWORKS_DIR/$base" | grep -v "/usr/lib\|/System" | awk '{print $1}' | grep -E '\.dylib|\.so')
                      for subdep in $subdeps; do
                          if [ -f "$subdep" ] && [ ! -f "$FRAMEWORKS_DIR/$(basename $subdep)" ]; then
                              subbase=$(basename "$subdep")
                              # Use the same copy approach for subdependencies
                              if cp -L "$subdep" "$FRAMEWORKS_DIR/" 2>/dev/null; then
                                  echo "Successfully copied subdep $subdep"
                              else
                                  sudo cp -L "$subdep" "$FRAMEWORKS_DIR/" 2>/dev/null || echo "Warning: Could not copy subdep $subdep"
                              fi
                            
                              if [ -f "$FRAMEWORKS_DIR/$subbase" ]; then
                                  install_name_tool -change "$subdep" "@loader_path/$subbase" "$FRAMEWORKS_DIR/$base"
                                  install_name_tool -id "@loader_path/$subbase" "$FRAMEWORKS_DIR/$subbase"
                              fi
                          fi
                      done

                      codesign --force --sign - "$FRAMEWORKS_DIR/$base"
                  else
                      echo "Warning: $base was not copied to Frameworks directory, skipping install_name_tool updates"
                  fi
              fi
          done

          codesign --force --sign - "$FLUENT_BIT_BIN" 

          # Verify the changes
          echo "After patching, new dependencies:"
          otool -L "$FLUENT_BIT_BIN" | grep @executable_path

          # Verify code signing
          echo "Verifying code signature:"
          codesign -v "$FLUENT_BIT_BIN" || echo "Note: Binary is ad-hoc signed"
        
          # List what's actually in the Frameworks directory
          echo "Contents of Frameworks directory:"
          ls -la "$FRAMEWORKS_DIR"

      - name: Build Package
        run: |
          VERSION=${{ needs.sync.outputs.latest_tag }}
          
          # Create package structure
          mkdir -p pkg_root/Library/Management/fluent-bit/bin
          mkdir -p pkg_root/Library/Management/fluent-bit/Frameworks
          
          # Find and copy the binary
          FLUENT_BIT_BIN=$(find build/ -type f -name 'fluent-bit' | grep -v '\.dSYM')
          cp "$FLUENT_BIT_BIN" pkg_root/Library/Management/fluent-bit/bin/
          
          # Copy the Frameworks directory with all dependencies
          BINARY_DIR=$(dirname "$FLUENT_BIT_BIN")
          if [ -d "$BINARY_DIR/../Frameworks" ]; then
              cp -R "$BINARY_DIR/../Frameworks/"* pkg_root/Library/Management/fluent-bit/Frameworks/ || true
          fi
          
          # Build the package - no scripts, no configs, just the binary and libs
          pkgbuild --root pkg_root \
                   --identifier com.fluent-bit.pkg \
                   --version "$VERSION" \
                   --install-location / \
                   "fluent-bit-${VERSION}-apple.pkg"
          
          # List what's in the package for verification
          echo "Package contents:"
          pkgutil --payload-files "fluent-bit-${VERSION}-apple.pkg"
          
          # Check file size
          echo "Package size:"
          ls -lh "fluent-bit-${VERSION}-apple.pkg"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: fluent-bit-*-apple.pkg
          tag_name: ${{ needs.sync.outputs.latest_tag }}
          body: |
            ## Fluent Bit Release ${{ needs.sync.outputs.latest_tag }}
            
            Self-contained Fluent Bit package for macOS.
            
            ### Installation
            sudo installer -pkg fluent-bit-${{ needs.sync.outputs.latest_tag }}-apple.pkg -target /
            ### Usage
            # Check version
            /Library/Management/fluent-bit/bin/fluent-bit --version
            
            # Run with your config
            /Library/Management/fluent-bit/bin/fluent-bit -c /path/to/your/config.conf
            ### Uninstall
            sudo rm -rf /Library/Management/fluent-bit